name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build signed source and wheel artifacts
        run: |
          python -m pip install build
          python -m build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netsift-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
