name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -v
      - name: Smoke-test installed CLI
        shell: bash
        run: |
          netsift generate smoke.pcap
          netsift packets smoke.pcap --filter "proto=dns" --format jsonl
          netsift summary smoke.pcap --format json

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install developer tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy src
      - name: Test with coverage
        run: pytest --cov=netsift --cov-report=term-missing --cov-fail-under=75
      - name: Build distributions
        run: python -m build
      - name: Verify wheel
        shell: bash
        run: python -m zipfile -l dist/*.whl
