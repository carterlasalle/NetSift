name: Bug report
description: Report a reproducible NetSift defect
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not attach sensitive production captures. Prefer `netsift generate` or a minimal synthetic frame.
  - type: input
    id: version
    attributes:
      label: NetSift and Python versions
      placeholder: NetSift 0.1.0, Python 3.13.5
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, smallest safe input description, output, and expected result.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true

